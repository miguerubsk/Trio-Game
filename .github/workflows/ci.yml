name: CI

on:
  # Every change reaches master through a pull request, and that's where the
  # checks run: also listening to branch pushes ran them twice per commit. On
  # master and on tags the publish workflow calls this one.
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
